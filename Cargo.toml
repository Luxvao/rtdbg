[workspace]
resolver = "2"
members = ["crates/rtdbg_runtime", "crates/librtdbg", "crates/example_target", "crates/rtdbg_wasm", "crates/imp_core", "crates/imep", "crates/rtdbg", "crates/rtdbg_gui", "crates/rtdbg_tui"]

[workspace.dependencies]
colog = "1.4.0"
ctor = "1.0.13"
imep = { path = "crates/imep" }
imp_core = { path = "crates/imp_core" }
libc = "0.2.191"
librtdbg = { path = "crates/librtdbg" }
log = "0.4.34"
paste = "1.0.15"
rhai = { version = "1.27.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
clap = "4.6.7"
clear-cache = "0.1.3"
color-eyre = "0.6.5"
crossterm = "0.29.0"
iced = "0.14.0"
ratatui = "0.30.2"
rfd = "0.17.2"
sysinfo = "0.39.6"
